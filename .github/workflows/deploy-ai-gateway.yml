name: Deploy AI Gateway

on:
  workflow_dispatch:
  push:
    paths:
      - "workers/ai-gateway/**"
      - ".github/workflows/deploy-ai-gateway.yml"
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://wordlyte-ai-gateway.oyomworld.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install dependencies
        working-directory: workers/ai-gateway
        run: npm ci

      - name: run gateway tests
        working-directory: workers/ai-gateway
        run: npm test

      - name: set worker secrets (from GitHub secrets)
        shell: bash
        working-directory: workers/ai-gateway
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          AI_TOKEN_SECRET: ${{ secrets.AI_TOKEN_SECRET }}
          AI_GATEWAY_SERVICE_TOKEN: ${{ secrets.AI_GATEWAY_SERVICE_TOKEN }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$DEEPGRAM_API_KEY" ] || [ -z "$ASSEMBLYAI_API_KEY" ] || [ -z "$AI_TOKEN_SECRET" ] || [ -z "$AI_GATEWAY_SERVICE_TOKEN" ]; then
            echo "::error::OPENAI_API_KEY, DEEPGRAM_API_KEY, ASSEMBLYAI_API_KEY, AI_TOKEN_SECRET, and AI_GATEWAY_SERVICE_TOKEN must be set in GitHub secrets."
            exit 1
          fi
          echo "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          echo "$DEEPGRAM_API_KEY" | npx wrangler secret put DEEPGRAM_API_KEY
          echo "$ASSEMBLYAI_API_KEY" | npx wrangler secret put ASSEMBLYAI_API_KEY
          echo "$AI_TOKEN_SECRET" | npx wrangler secret put AI_TOKEN_SECRET
          echo "$AI_GATEWAY_SERVICE_TOKEN" | npx wrangler secret put AI_GATEWAY_SERVICE_TOKEN

      - name: deploy worker
        working-directory: workers/ai-gateway
        run: npx wrangler deploy

      - name: smoke test deployed worker
        shell: bash
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$WORKER_URL/health" | grep -q '"status":"ok"'; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Smoke test failed — AI Gateway not healthy after deploy."
          exit 1
