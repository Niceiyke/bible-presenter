name: Build Windows Exe
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.tag_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: check if version tag already exists
        id: tag_check
        run: |
          VERSION=$(node -p "require('./desktop-rs/src-tauri/tauri.conf.json').version")
          echo "Version: $VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION$"; then
            echo "Tag v$VERSION already exists — skipping build"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION is new — build will run"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup gstreamer
        uses: blinemedical/setup-gstreamer@v1.4.0
        with:
          version: '1.26.1'
          arch: 'x86_64'

      - name: install frontend dependencies
        run: |
          cd desktop-rs
          npm install

      - name: create data directories
        shell: bash
        run: |
          mkdir -p desktop-rs/src-tauri/models
          mkdir -p desktop-rs/src-tauri/bible_data
          # Small placeholder for hymns which is still bundled
          echo "[]" > desktop-rs/src-tauri/bible_data/hymns.json

      - name: build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: "-C target-feature=-crt-static"
          MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
          VCPKG_DEFAULT_TRIPLET: "x64-windows"
          CFLAGS: "/MD"
          CXXFLAGS: "/MD"
          CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
        with:
          projectPath: desktop-rs
          tagName: ${{ github.event_name == 'workflow_dispatch' && format('v__VERSION__-manual-{0}', github.run_number) || 'v__VERSION__' }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && format('Bible Presenter v__VERSION__ (Manual Build {0})', github.run_number) || 'Bible Presenter v__VERSION__' }}
          releaseBody: "See the assets below to download this version. Note: Core Bible assets and AI models are now downloaded within the app after installation."
          releaseDraft: false
          prerelease: false
