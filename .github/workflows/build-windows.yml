name: Build Windows Exe
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.tag_check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: check if version tag already exists
        id: tag_check
        run: |
          VERSION=$(node -p "require('./desktop-rs/src-tauri/tauri.conf.json').version")
          echo "Version: $VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION$"; then
            echo "Tag v$VERSION already exists — skipping build"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION is new — build will run"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: |
          cd desktop-rs
          npm install

      - name: download models and bible data
        shell: bash
        run: |
          set -e
          mkdir -p desktop-rs/src-tauri/models
          mkdir -p desktop-rs/src-tauri/bible_data

          # ── AI models (public HuggingFace) ────────────────────────────────
          echo "Downloading ONNX embedding model..."
          curl -L "https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/main/onnx/model.onnx" \
            -o "desktop-rs/src-tauri/models/bge-small-en-v1.5.onnx"


          # ── Bible database (public repo) ────────────────────────────────
          echo "Downloading super_bible.db (~59 MB)..."
          curl -L "https://raw.githubusercontent.com/alshival/super_bible/main/SUPER_BIBLE/super_bible.db" \
            -o "desktop-rs/src-tauri/bible_data/super_bible.db"

          # ── Stacked embeddings (Google Drive) ──────────────────────────
          echo "Downloading all_versions_embeddings.usearch from Google Drive..."
          pip install -q gdown
          gdown "https://drive.google.com/uc?id=18rQG5jnZQoM2v1l2EV71VWyTp38lEe5f" \
            -O "desktop-rs/src-tauri/bible_data/all_versions_embeddings.usearch"

          # ── verse_index.json (committed in repo) ────────────────────────
          if [ -f "desktop-rs/src-tauri/bible_data/verse_index.json" ]; then
            echo "verse_index.json found in repo."
          else
            echo "CRITICAL: verse_index.json missing! Commit it to the repo first."
            exit 1
          fi

          # ── Verify all required files ───────────────────────────────────
          echo "Verifying files..."
          ls -lh desktop-rs/src-tauri/models/
          ls -lh desktop-rs/src-tauri/bible_data/

          for f in \
            "desktop-rs/src-tauri/models/bge-small-en-v1.5.onnx" \
            "desktop-rs/src-tauri/models/tokenizer.json" \
            "desktop-rs/src-tauri/bible_data/super_bible.db" \
            "desktop-rs/src-tauri/bible_data/all_versions_embeddings.usearch" \
            "desktop-rs/src-tauri/bible_data/verse_index.json"; do
            if [ ! -f "$f" ]; then
              echo "CRITICAL: $f missing!"
              exit 1
            fi
            echo "OK: $f ($(du -h "$f" | cut -f1))"
          done

      - name: validate usearch index
        shell: python
        run: |
          import sys, os
          path = 'desktop-rs/src-tauri/bible_data/all_versions_embeddings.usearch'
          
          if not os.path.exists(path):
              print('CRITICAL: USearch index not found at ' + path)
              sys.exit(1)
          
          size_bytes = os.path.getsize(path)
          print('Size of index: ' + str(size_bytes / (1024*1024)) + ' MB')
          if size_bytes < 1000000: # at least 1MB
              print('CRITICAL: USearch index too small, download likely failed.')
              sys.exit(1)
          
          print('PASSED: USearch index validated.')
      - name: build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: "-C target-feature=-crt-static"
          MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
          VCPKG_DEFAULT_TRIPLET: "x64-windows"
          CFLAGS: "/MD"
          CXXFLAGS: "/MD"
          CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
        with:
          projectPath: desktop-rs
          tagName: v__VERSION__
          releaseName: "Bible Presenter v__VERSION__"
          releaseBody: "See the assets below to download this version."
          releaseDraft: false
          prerelease: false
