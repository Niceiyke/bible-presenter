name: Build Windows Exe
on:
  # Build only after the CI Check workflow completes successfully (or when
  # triggered manually). This gates the release build on frontend + backend
  # tests passing.
  workflow_run:
    workflows: ["CI Check"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  check-version:
    # Gate: a release build only runs when CI Check passed. Manual dispatch
    # bypasses the gate (explicit operator action).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.tag_check.outputs.exists }}
    steps:
      # workflow_run does not automatically check out the CI-tested commit;
      # pin the ref so the build matches exactly what passed CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: check if version tag already exists
        id: tag_check
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Version: $VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION$"; then
            echo "Tag v$VERSION already exists — skipping build"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION is new — build will run"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: verify license server endpoint is configured
        shell: bash
        run: |
          if grep -q "YOUR_SUBDOMAIN" src-tauri/src/license.rs; then
            echo "::error::License endpoint placeholder (YOUR_SUBDOMAIN) is still set in src-tauri/src/license.rs. Update default_server_url() to your real workers.dev URL before building a release."
            exit 1
          fi
          echo "License endpoint is configured."

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (bindgen for ffmpeg-sys-next)
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          clang --version

      # Cache the pinned ffmpeg artifacts keyed on the fetch script (a pin or
      # hash edit changes the key and forces a re-download).
      - name: restore pinned ffmpeg artifacts
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/ffmpeg-dist
            src-tauri/binaries/dll
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      # Downloads the pinned shared GPL build and stages:
      #   src-tauri/ffmpeg-dist/{include,lib,bin}  (FFMPEG_DIR for linking)
      #   src-tauri/binaries/dll/av*.dll+sw*.dll   (bundled beside the exes)
      # Idempotent — exits early when the cached artifacts are present. The
      # bundler (scripts/copy-engine-binary.mjs, beforeBundleCommand) then
      # ships the DLLs from $FFMPEG_DIR/bin at the bundle ROOT beside both exes.
      - name: fetch pinned ffmpeg shared build
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1
          $dist = Join-Path $env:GITHUB_WORKSPACE "src-tauri\ffmpeg-dist"
          if (-not (Test-Path (Join-Path $dist "lib\avcodec.lib"))) { throw "ffmpeg dev tree missing after fetch" }
          echo "FFMPEG_DIR=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: install frontend dependencies
        run: npm ci

      - name: create data directories
        shell: bash
        run: |
          mkdir -p src-tauri/models
          mkdir -p src-tauri/bible_data

      - name: verify release prerequisites (pins + bundled resources)
        shell: bash
        run: |
          set -euo pipefail
          # The Bible data ZIP must have a pinned SHA-256 before a release ships.
          if grep -qE 'BIBLE_DATA_ZIP_SHA256: Option<&str> = None' src-tauri/src/commands/assets.rs; then
            echo "::error::BIBLE_DATA_ZIP_SHA256 is not pinned in src-tauri/src/commands/assets.rs. Compute it and set it before releasing."
            exit 1
          fi
          # Required bundled resources must exist before packaging. (dist/ is
          # generated by the tauri beforeBuildCommand, so remote.html is not
          # checked here. ffmpeg.exe is no longer bundled — in-process libav.)
          for f in src-tauri/bible_data/hymns.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Required bundled resource is missing: $f"
              exit 1
            fi
          done
          echo "Release prerequisites OK (bible ZIP hash pinned, resources present)."

      - name: build and publish release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: "-C target-feature=-crt-static"
          MSVC_RUNTIME_LIBRARY: "MultiThreadedDLL"
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && format('v__VERSION__-manual-{0}', github.run_number) || 'v__VERSION__' }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && format('Bible Presenter v__VERSION__ (Manual Build {0})', github.run_number) || 'Bible Presenter v__VERSION__' }}
          releaseBody: "See the assets below to download this version. Note: Core Bible assets and AI models are now downloaded within the app after installation."
          releaseDraft: false
          prerelease: false

      # The packaged NSIS installer must be smoke-tested on a clean Windows
      # machine before broad beta: install, launch, license gate, output/stage
      # windows, remote bundle, hymns, ffmpeg discovery, and recording/streaming
      # gates. This is a manual release-qualification step (a GUI smoke test
      # cannot run in this CI runner); record the result in the release notes.
