name: CI Check
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # undici 8.10 (via jsdom/vitest) requires node:worker_threads
          # markAsUncloneable, which only exists on Node >= 24.
          node-version: 24
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck + build
        run: npm run build

      # WP11 (P2-5): the packaged installer maps `dist` into the bundle, and the
      # remote Control browser bundle is a separate entry. Verify it is actually
      # produced so a release can never ship without the remote surface.
      - name: verify remote bundle is built
        run: test -f dist/remote.html

      - name: run frontend tests
        run: npm run test

  license-worker:
    # WP11 (P2-5): the license worker validates keys/device-slots server-side;
    # its tests gate the release just like the frontend/backend suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install worker dependencies
        working-directory: workers/license
        run: npm ci

      - name: run license worker tests
        working-directory: workers/license
        run: npm test

  backend:
    # The app ships only for Windows (NSIS/WebView2); Tauri's glib/gtk -sys
    # crates also fail to pkg-config on bare ubuntu runners. Build/check on the
    # actual target platform instead of installing the whole Linux GTK stack.
    # ffmpeg-next is now default (pipe removed) — this job always builds the
    # in-process libav path (needs LLVM + vcpkg ffmpeg).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # tauri-build validates bundled resources at compile time, but dist/ and
      # the wordlyte-engine binary are gitignored (produced by the build).
      # Create placeholder so cargo check/clippy/test can run as a fast
      # compile gate; the release workflow produces the real artifact.
      - name: create bundled-resource placeholders for tauri-build
        shell: bash
        run: |
          mkdir -p src-tauri/binaries dist
          touch src-tauri/binaries/wordlyte-engine.exe dist/.keep

      - name: Install LLVM (bindgen for ffmpeg-sys-next)
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          clang --version

      - name: Install pkg-config
        shell: pwsh
        run: |
          if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            choco install pkgconfiglite -y --no-progress
            echo "C:\Program Files\pkgconfiglite" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          pkg-config --version

      - name: Install ffmpeg via vcpkg (system vcpkg at C:\vcpkg)
        shell: pwsh
        run: |
          vcpkg --version
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows\lib\pkgconfig\libavutil.pc")) {
            vcpkg install ffmpeg[core]:x64-windows --clean-after-build
          } else {
            echo "ffmpeg already installed in C:\vcpkg"
          }
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          # pkgconfiglite puts pkg-config.exe on PATH (C:\ProgramData\chocolatey\bin)
          Get-Command pkg-config | Select-Object Source
          pkg-config --modversion libavutil

      - name: Verify pkg-config can find libavutil
        shell: pwsh
        run: |
          echo "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"
          Get-ChildItem C:\vcpkg\installed\x64-windows\lib\pkgconfig\libav*.pc | Select-Object Name
          pkg-config --modversion libavutil
          pkg-config --cflags --libs libavutil

      - name: cargo check
        working-directory: src-tauri
        env:
          PKG_CONFIG_PATH: "C:\\vcpkg\\installed\\x64-windows\\lib\\pkgconfig"
          VCPKGRS_DYNAMIC: "1"
        run: cargo check

      - name: cargo clippy
        working-directory: src-tauri
        env:
          PKG_CONFIG_PATH: "C:\\vcpkg\\installed\\x64-windows\\lib\\pkgconfig"
          VCPKGRS_DYNAMIC: "1"
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        env:
          PKG_CONFIG_PATH: "C:\\vcpkg\\installed\\x64-windows\\lib\\pkgconfig"
          VCPKGRS_DYNAMIC: "1"
        run: cargo test
