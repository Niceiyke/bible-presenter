name: CI Check
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # undici 8.10 (via jsdom/vitest) requires node:worker_threads
          # markAsUncloneable, which only exists on Node >= 24.
          node-version: 24
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck + build
        run: npm run build

      # WP11 (P2-5): the packaged installer maps `dist` into the bundle, and the
      # remote Control browser bundle is a separate entry. Verify it is actually
      # produced so a release can never ship without the remote surface.
      - name: verify remote bundle is built
        run: test -f dist/remote.html

      - name: run frontend tests
        run: npm run test

  license-worker:
    # WP11 (P2-5): the license worker validates keys/device-slots server-side;
    # its tests gate the release just like the frontend/backend suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install worker dependencies
        working-directory: workers/license
        run: npm ci

      - name: run license worker tests
        working-directory: workers/license
        run: npm test

  backend:
    # The app ships only for Windows (NSIS/WebView2); Tauri's glib/gtk -sys
    # crates also fail to pkg-config on bare ubuntu runners. Build/check on the
    # actual target platform instead of installing the whole Linux GTK stack.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # tauri-build validates bundled resources at compile time, but dist/ and
      # the ffmpeg binaries are gitignored (produced by the release build).
      # Create placeholders so cargo check/clippy/test can run as a fast
      # compile + lint gate; the release workflow fetches the real artifacts.
      - name: create bundled-resource placeholders for tauri-build
        shell: bash
        run: |
          mkdir -p src-tauri/binaries dist
          touch src-tauri/binaries/ffmpeg.exe src-tauri/binaries/ffprobe.exe src-tauri/binaries/wordlyte-engine.exe dist/.keep

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test