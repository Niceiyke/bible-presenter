name: CI Check
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # undici 8.10 (via jsdom/vitest) requires node:worker_threads
          # markAsUncloneable, which only exists on Node >= 24.
          node-version: 24
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck + build
        run: npm run build

      # WP11 (P2-5): the packaged installer maps `dist` into the bundle, and the
      # remote Control browser bundle is a separate entry. Verify it is actually
      # produced so a release can never ship without the remote surface.
      - name: verify remote bundle is built
        run: test -f dist/remote.html

      - name: run frontend tests
        run: npm run test

  license-worker:
    # WP11 (P2-5): the license worker validates keys/device-slots server-side;
    # its tests gate the release just like the frontend/backend suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install worker dependencies
        working-directory: workers/license
        run: npm ci

      - name: run license worker tests
        working-directory: workers/license
        run: npm test

  backend:
    # The app ships only for Windows (NSIS/WebView2); Tauri's glib/gtk -sys
    # crates also fail to pkg-config on bare ubuntu runners. Build/check on the
    # actual target platform instead of installing the whole Linux GTK stack.
    # ffmpeg-next is now default (pipe removed) — this job always builds the
    # in-process libav path: it links against the pinned BtbN SHARED GPL build
    # fetched by scripts/fetch-ffmpeg.ps1 (needs LLVM for bindgen; FFMPEG_DIR
    # alone steers ffmpeg-sys-next — no vcpkg / pkg-config).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install LLVM (bindgen for ffmpeg-sys-next)
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          clang --version

      # Cache the pinned ffmpeg artifacts keyed on the fetch script (a pin or
      # hash edit changes the key and forces a re-download).
      - name: restore pinned ffmpeg artifacts
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/ffmpeg-dist
            src-tauri/binaries/dll
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      # Downloads the pinned shared GPL build and stages:
      #   src-tauri/ffmpeg-dist/{include,lib,bin}  (FFMPEG_DIR for linking)
      #   src-tauri/binaries/dll/av*.dll+sw*.dll   (bundled beside the exes)
      # Idempotent — exits early when the cached artifacts are present.
      - name: fetch pinned ffmpeg shared build
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1
          $dist = Join-Path $env:GITHUB_WORKSPACE "src-tauri\ffmpeg-dist"
          if (-not (Test-Path (Join-Path $dist "lib\avcodec.lib"))) { throw "ffmpeg dev tree missing after fetch" }
          echo "FFMPEG_DIR=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append

      # tauri-build validates bundled resources at compile time, but dist/
      # and the wordlyte-engine binary are gitignored (produced by the build).
      # The same --bootstrap mode the release build uses derives the resource
      # list from tauri.conf.json and writes 0-byte placeholders (the runtime
      # DLL glob is already satisfied by the fetched av*/sw*.dll) so cargo
      # check/clippy/test can run as a fast compile gate.
      - name: create bundled-resource placeholders for tauri-build
        shell: bash
        run: |
          mkdir -p dist
          node scripts/copy-engine-binary.mjs --bootstrap

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
