name = "wordlyte-license"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Create a KV namespace first, then paste its id here:
#   npx wrangler kv namespace create LICENSES
[[kv_namespaces]]
binding = "LICENSES"
id = "cbed13eefcd04404b8c436d9f1ab5d21"

# Durable Object that serializes per-key record mutations (device-slot
# registration in /validate must be atomic — see src/index.js).
[[durable_objects.bindings]]
name = "LICENSE_REGISTRY"
class_name = "LicenseRegistry"

[[migrations]]
tag = "v1"
# Cloudflare free-plan Durable Objects must use SQLite-backed storage; the
# `new_classes` migration is rejected (code 10097).
new_sqlite_classes = ["LicenseRegistry"]

# Create the admin secret before the first deploy:
#   npx wrangler secret put ADMIN_TOKEN

# Optional: daily expiry-reminder cron (09:00 UTC). Posts to
# EXPIRY_WEBHOOK_URL (Slack/Discord/Teams incoming webhook) if configured;
# otherwise the scheduled handler just logs.
[triggers]
crons = ["0 9 * * *"]