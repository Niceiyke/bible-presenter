name = "wordlyte-license"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Organization records and pending device activation-code hashes.
[[kv_namespaces]]
binding = "ORGANIZATIONS"
id = "cbed13eefcd04404b8c436d9f1ab5d21"

# Durable Object that serializes per-organization activation, device, and plan
# mutations. It prevents two devices from spending the last available slot.
[[durable_objects.bindings]]
name = "ORGANIZATION_REGISTRY"
class_name = "OrganizationRegistry"

# Preserve the deployed SQLite Durable Object namespace and its data while
# moving the registry implementation to the organization-based name. Migration
# history is required on every subsequent deploy of this existing Worker.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LicenseRegistry"]

[[migrations]]
tag = "v2"

  [[migrations.renamed_classes]]
  from = "LicenseRegistry"
  to = "OrganizationRegistry"

# Create the admin secret before the first deploy:
#   npx wrangler secret put ADMIN_TOKEN

# Optional: daily expiry-reminder cron (09:00 UTC). Posts to
# EXPIRY_WEBHOOK_URL (Slack/Discord/Teams incoming webhook) if configured;
# otherwise the scheduled handler just logs.
[triggers]
crons = ["0 9 * * *"]
