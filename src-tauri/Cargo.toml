[package]
name = "wordlyte"
version = "2.1.0"
description = "Wordlyte — A professional, real-time Bible projection tool for churches."
authors = ["Wordlyte Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled-full"] }
anyhow = "1.0"
parking_lot = "0.12"
regex = "1.10"
image = "0.25"
base64 = "0.22"
once_cell = "1"
reqwest  = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "multipart"], default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2.2.1", features = ["deflate"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
time = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
log = "0.4"
sysinfo = "0.33"
machine-uid = "0.4"
# Ed25519 verification for the license signing layer (see license.rs + workers/license).
# The client never signs — it only verifies against the embedded public key.
ed25519-dalek = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Phase 0 native-capture probe + Phase 4 WGC capture pipeline.
raw-window-handle = "0.6"
windows = { version = "=0.61.3", features = [
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Com",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Pipes",
  "Win32_Security",
  "Win32_Security_Cryptography",
] }

[lib]
name = "wordlyte_lib"
crate-type = ["rlib"]

# NDI output (Phase 8 scaffold). The sender pipeline (H.264 -> NDI|HX via the
# official NDI SDK) is feature-gated: it needs the NDI 6 SDK installed (EULA,
# see docs/OUTPUT_MANAGER_DESIGN.md) plus `grafton-ndi` + bindgen. The command
# surface in `commands/ndi.rs` exists in both modes; `cargo build --features ndi`
# enables the real pipeline once the dependency is added.
[features]
default = []
ndi = []

[[bin]]
name = "wordlyte"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true
