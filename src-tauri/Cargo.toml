[package]
name = "wordlyte"
version = "2.0.2"
description = "Wordlyte — A professional, real-time Bible projection tool for churches."
authors = ["Wordlyte Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled-full"] }
anyhow = "1.0"
parking_lot = "0.12"
regex = "1.10"
image = "0.25"
base64 = "0.22"
once_cell = "1"
reqwest  = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "multipart"], default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2.2.1", features = ["deflate"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
time = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
webrtc = "0.11"
tracing = "0.1"
log = "0.4"
sysinfo = "0.33"
machine-uid = "0.4"
# ECDSA P-256 signature verification for the signed license token (WP: license
# hardening) — the app embeds only the public key; the Cloudflare Worker signs
# with the private key.
p256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
wgpu = "30.0.0"
glyphon = "0.12.0"
bytemuck = "1.25.2"
pollster = "1.0.1"
# Engine-owned output/stage windows (Phase C). winit 0.30 pairs with wgpu 30
# (raw-window-handle 0.6) and uses the ApplicationHandler + resumed() model.
winit = { version = "0.30", features = ["rwh_06"] }
# JPEG encode for the engine's MJPEG preview frames (Phase C).
jpeg-encoder = "0.6"
# In-process decode/encode/mux (Phase H/D ffmpeg-next). Pipe fallback removed — tracks ffmpeg 7.x..9.x.
ffmpeg-next = { version = "9.0" }
# Windows DPAPI (CryptProtectData) to encrypt the license record at rest.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase", "winnt", "minwindef"] }
# wgpu 30's DX12 backend (wgpu-hal) depends on windows 0.62, but `tao` pins 0.61
# and gpu-allocator's range (>=0.53, <=0.62) caps at 0.62.0, so the resolver
# split gpu-allocator onto 0.61.3 while wgpu-hal took 0.62.2 — two incompatible
# ID3D12Device types. Pinning windows to exactly 0.62.0 satisfies both ranges
# (gpu-allocator `<=0.62.0`, wgpu-hal `>=0.62.0, <0.63.0`) and unifies the types.
# Features are additive: MediaFoundation + Com serve camera enumeration (Phase I1).
windows = { version = "=0.62.0", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"], default-features = false }

[lib]
name = "wordlyte_lib"
crate-type = ["rlib"]

# NDI output (Phase 8 scaffold). The sender pipeline (H.264 -> NDI|HX via the
# official NDI SDK) is feature-gated: it needs the NDI 6 SDK installed (EULA,
# see docs/OUTPUT_MANAGER_DESIGN.md) plus `grafton-ndi` + bindgen. The command
# surface in `commands/ndi.rs` exists in both modes; `cargo build --features ndi`
# enables the real pipeline once the dependency is added.
[features]
default = []
ndi = []

[[bin]]
name = "wordlyte"
path = "src/main.rs"

# Rust video engine sidecar (Phase A2): spawned by the Tauri shell at startup,
# owns authoritative presentation state + (eventually) all video. Speaks the
# newline-delimited JSON-RPC contract in `engine/ipc.rs` over stdio.
[[bin]]
name = "wordlyte-engine"
path = "src/engine_main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true
