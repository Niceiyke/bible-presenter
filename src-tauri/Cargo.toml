[package]
name = "wordlyte"
version = "1.10.16"
description = "Wordlyte — A professional, real-time Bible projection tool for churches."
authors = ["Wordlyte Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled-full"] }
anyhow = "1.0"
parking_lot = "0.12"
regex = "1.10"
image = "0.25"
base64 = "0.22"
once_cell = "1"
reqwest  = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "multipart"], default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2.2.1", features = ["deflate"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
time = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
webrtc = "0.11"
tracing = "0.1"
log = "0.4"

[lib]
name = "wordlyte_lib"
crate-type = ["rlib"]

[[bin]]
name = "wordlyte"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true
